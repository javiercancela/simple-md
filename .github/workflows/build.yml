name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm xvfb libnss3 libgbm1 \
            libgtk-3-0t64 libasound2t64 \
            || sudo apt-get install -y fakeroot rpm xvfb libnss3 libgbm1 libgtk-3-0 libasound2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run make
      - name: End-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e
